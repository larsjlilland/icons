<svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .navy { stroke: #1B2340; }
      .ol { stroke: #1B2340; stroke-width: 3.4; stroke-linejoin: round; stroke-linecap: round; }
    </style>
    <clipPath id="cc"><circle cx="110" cy="110" r="110"/></clipPath>
    <clipPath id="crownR"><rect x="30" y="-110" width="60" height="70"/></clipPath>
  </defs>

  <g transform="translate(110,110)">
    <circle r="110" fill="#1F7A4D"/>
    <g clip-path="url(#cc)" transform="translate(-110,-110)">
      <g transform="translate(110,110)">
        <path d="M -104,-52 Q -40,-96 20,-70 Q 74,-48 104,-74" fill="none" stroke="#9BE8C0" stroke-width="13" stroke-linecap="round" opacity="0.30"/>
        <path d="M -104,-30 Q -44,-74 24,-50 Q 76,-30 106,-54" fill="none" stroke="#D7F27A" stroke-width="9" stroke-linecap="round" opacity="0.20"/>
      </g>
    </g>
    <ellipse fill="#000000" opacity="0.14" cx="0" cy="88" rx="95" ry="26" clip-path="url(#cc)" transform="translate(-110,-110)"/>

    <g transform="rotate(-5)">
      <!-- head -->
      <rect x="-75" y="-75" width="150" height="150" rx="42" fill="#EEF3F8" class="navy" stroke-width="8"/>

      <!-- trucker cap -->
      <g transform="rotate(-6 0 -56)">
        <path class="navy" stroke-width="8" d="M -62,-44 A 62,54 0 0 1 62,-44 Z" fill="#F1EEE3"/>
        <g clip-path="url(#crownR)">
          <path d="M -62,-44 A 62,54 0 0 1 62,-44 Z" fill="#2E7D52"/>
        </g>
        <path d="M 30,-44 C 31,-62 31,-80 30,-90" fill="none" stroke="#1B2340" stroke-width="3.5" stroke-linecap="round"/>
        <path class="navy" stroke-width="8" fill="none" d="M -62,-44 A 62,54 0 0 1 62,-44"/>
        <path d="M -44,-64 C -38,-80 -24,-90 -10,-94" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
        <circle class="navy" stroke-width="3.5" cx="0" cy="-94" r="6.5" fill="#14603B"/>
        <ellipse class="navy" stroke-width="3.5" cx="-6" cy="-68" rx="18" ry="13" fill="#F7D046"/>
        <path d="M -16,-68 Q -6,-77 4,-68 Q -6,-59 -16,-68" fill="#FFEEA8" opacity="0.85"/>
        <path class="navy" stroke-width="2.5" d="M 8,-79 Q 17,-83 19,-76 Q 12,-72 8,-79 Z" fill="#4FA96C"/>
        <path class="navy" stroke-width="8" d="M -80,-44 C -52,-14 52,-14 80,-44 C 52,-56 -52,-56 -80,-44 Z" fill="#14603B"/>
        <path d="M -58,-38 C -34,-20 34,-20 58,-38" fill="none" stroke="#2E8A5B" stroke-width="5" stroke-linecap="round"/>
      </g>

      <!-- cool, heavy-lidded expression -->
      <circle cx="-28" cy="0" r="9.5" fill="#1B2340"/>
      <circle cx="28" cy="0" r="9.5" fill="#1B2340"/>
      <path d="M -40,-2 Q -28,-10 -16,-2" fill="none" stroke="#EEF3F8" stroke-width="11" stroke-linecap="round"/>
      <path d="M 16,-2 Q 28,-10 40,-2" fill="none" stroke="#EEF3F8" stroke-width="11" stroke-linecap="round"/>
      <path d="M -40,-4 Q -28,-12 -16,-4" fill="none" class="navy" stroke-width="5" stroke-linecap="round"/>
      <path d="M 16,-4 Q 28,-12 40,-4" fill="none" class="navy" stroke-width="5" stroke-linecap="round"/>
      <path d="M -16,32 Q 4,42 28,24" fill="none" class="navy" stroke-width="6" stroke-linecap="round"/>

      <!-- TOOL: magic wand, grip lower-left, star tip up-right -->
      <g transform="translate(48,48) rotate(-45) scale(1.2)">
        <path class="ol" d="M -50,-4.6 L 30,-3 L 30,3 L -50,4.6 Z" fill="#2B2F4A"/>
        <line x1="-44" y1="-1.8" x2="24" y2="-0.8" stroke="#6A7096" stroke-width="1.8" stroke-linecap="round"/>
        <rect class="ol" x="-34" y="-5.6" width="7" height="11.2" rx="1.5" fill="#FFD873"/>
        <rect class="ol" x="-22" y="-5.2" width="5" height="10.4" rx="1.5" fill="#FFD873"/>
        <ellipse class="ol" cx="-52" cy="0" rx="4.5" ry="6.5" fill="#FFD873"/>
        <polygon class="ol" points="46,-18 52,-5 65,0 52,5 46,18 40,5 27,0 40,-5" fill="#FFD873"/>
        <circle cx="46" cy="0" r="3.5" fill="#FFF3C4"/>
        <g fill="#FFEFA8" stroke="#1B2340" stroke-width="1.6" stroke-linejoin="round">
          <polygon points="26,-22 28,-16 34,-14 28,-12 26,-6 24,-12 18,-14 24,-16"/>
          <polygon points="60,-20 61.5,-15.5 66,-14 61.5,-12.5 60,-8 58.5,-12.5 54,-14 58.5,-15.5"/>
          <polygon points="18,14 19.5,18 23.5,19.5 19.5,21 18,25 16.5,21 12.5,19.5 16.5,18"/>
        </g>
      </g>
    </g>
  </g>
</svg>
